# dsh-web-search-extend bundle layer: inserts this plugin as the replacement
# of the official web-search-deepseek.
#
# The trailing disable turns off the official web-search-deepseek entry; it
# must stay in this layer (applied after dsh-base inserts the official one).
#
# This entry registers under its own id (`dsh-web-search-extend`) but takes over
# the official Settings namespace (`web-search-deepseek`) and the official
# provider slot (`deepseek-official`), so the config page and the old
# `web_search` tool stay exactly where they were.
- insert:
    - id: dsh-web-search-extend
      name: '@mr.robot/dsh-web-search-extend'
      config: {}

- id: web-search-deepseek
  disabled: true

